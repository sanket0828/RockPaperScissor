<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h2>Rock Paper Scissors</h2>

    <div class="button-row">
      <button class="game-button" onclick="
        let userChoice = 'Rock';
        let userNo = 0;
        computerChoice(userChoice, userNo);
        tempResult(userChoice);
      ">
        <img src="assets/rockCircle.jpg" alt="Rock" />
        <span>Rock</span>
      </button>

      <button class="game-button" onclick="
        userChoice = 'Paper';
        userNo = 1/3;
        computerChoice(userChoice, userNo);
        tempResult(userChoice);
      ">
        <img src="assets/paperCircle.jpg" alt="Paper" />
        <span>Paper</span>
      </button>

      <button class="game-button" onclick="
        userChoice = 'Scissor';
        userNo = 1;
        computerChoice(userChoice, userNo);
        tempResult(userChoice);
      ">
        <img src="assets/scissorCircle.jpg" alt="Scissor" />
        <span>Scissor</span>
      </button>
    </div>

    <div class="result-box">
      <p class="curResult">Current Game Result will display here</p>        
    </div>

    <div class="action-buttons">
      <button class="action show" onclick="displayScore()">Show Score</button>
      <button class="action reset" onclick="resetScore()">Reset Score</button>
    </div>

    <div class="score-box">
      <p class="p-score">Score will be displayed here</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
