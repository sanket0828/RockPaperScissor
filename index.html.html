<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h2>Game : Rock Paper Scissor</h2>
    <button class="rock" onclick="
    let userChoice = 'Rock';
    let userNo = 0;
    computerChoice(userChoice, userNo);
    tempResult(userChoice);
    "><img src="assets/rockCircle.jpg" alt="rock hand sign image" class="rock-img"></button>

    <button class="paper" onclick="
    userChoice = 'Paper';
    userNo = 1/3;
    computerChoice(userChoice, userNo);
    tempResult(userChoice);
    "><img src="assets/paperCircle.jpg" alt="paper hand sign image" class="paper-img"></button>

    <button class="scissor" onclick="
    userChoice = 'Scissor';
    userNo = 1;
    computerChoice(userChoice, userNo);
    tempResult(userChoice);
    "><img src="assets/scissorCircle.jpg" alt="Scissor hand sign image" class="scissor-img"></button><br>

    <div class="div-curResult">
    <p class="curResult">Current Game Result will display here</p>        
    </div>


    <br><br>
    
    <button id="showScore" onclick="
    displayScore();
    ">Show Score</button>

    <button id="resetScore" onclick="
    resetScore();
    ">Reset Score</button>

    <div class="div-score">
        <p class="p-score" >Score will be displayed here</p>
    </div>
    

<script src="game.js"></script>

</body>
</html>
